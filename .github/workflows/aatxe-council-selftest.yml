# Self-test workflow for the aatxe agent council — runs on aatxe's own
# PRs against the real PR diff (not a bundled fixture).
#
# Modes, in order of cost:
#
#   1. Stub LLM, real PR diff (DEFAULT on `pull_request`).
#      `AATXE_COUNCIL_STUB=1` short-circuits every Moonshot/Anthropic
#      call; the stub returns deterministic canned findings. We still
#      fetch the real PR diff over the GH API and walk it through the
#      full proposer → judge → render pipeline, which catches wiring
#      bugs that the fixture-only path misses (renames, large multi-file
#      diffs, branch-vs-target paths). Free, deterministic, runs on
#      every PR.
#
#   2. Fixture mode (workflow_dispatch with `mode=fixture`).
#      Falls back to the bundled `examples/council-bench/fixtures/sample.diff`
#      so the council can be exercised without an open PR — useful for
#      smoke-testing the pipeline in isolation (or under `act`).
#
#   3. Real LLM, real PR diff (auto on `pull_request` when a backend
#      secret is provisioned; also workflow_dispatch with `mode=real`).
#      Requires either `ANTHROPIC_API_KEY` (claude-code backend,
#      preferred — it produced the published 0.857 critical-F1
#      baseline) or `KIMI_API_KEY` (pi-proxy backend). Posts the sticky
#      `<!-- aatxe:council -->` comment on the PR.
#
# `pull_request` runs auto-promote to mode 3 when a backend secret is
# present on the repo (`ANTHROPIC_API_KEY` → claude-code, else
# `KIMI_API_KEY` → pi-proxy) — that's the real-PR dogfooding loop. With
# no secret provisioned (and always on fork PRs, which never see
# secrets) they fall back to mode 1, free and deterministic.

name: aatxe-council-selftest

on:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "stub | fixture | real"
        required: false
        default: 'stub'
        type: choice
        options:
          - stub
          - fixture
          - real
      pr-number:
        description: "PR number to review (required when mode != fixture and not triggered by pull_request)"
        required: false
        default: ''
        type: string
      backend:
        description: "LLM backend when mode=real (pi-proxy | claude-code)"
        required: false
        default: 'pi-proxy'
        type: choice
        options:
          - pi-proxy
          - claude-code

permissions:
  contents: read
  pull-requests: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    # 20 (not 10): real-LLM runs add minutes of council latency on top
    # of the cached cargo build. Stub runs still finish well under 10.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build aatxe CLI from workspace
        run: cargo build --release -p aatxe

      - name: Resolve mode + PR number
        id: cfg
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_PR: ${{ github.event.inputs.pr-number }}
          INPUT_BACKEND: ${{ github.event.inputs.backend }}
          PR_NUM: ${{ github.event.pull_request.number }}
          # Don't expand the secret into the shell — just check
          # presence by length-of-non-empty. GH masks the value in logs
          # but reading it via env keeps it out of the rendered command.
          HAS_KIMI: ${{ secrets.KIMI_API_KEY != '' }}
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          # Honor the explicit input for workflow_dispatch. For
          # pull_request events, auto-promote to `real` when a backend
          # secret is present (the real-PR dogfooding loop); fall back
          # to `stub` otherwise — fork PRs never see secrets, so they
          # always stay on the free deterministic path.
          mode="${INPUT_MODE:-stub}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "$HAS_ANTHROPIC" = "true" ] || [ "$HAS_KIMI" = "true" ]; then
              mode="real"
            else
              mode="stub"
            fi
          fi
          pr="${INPUT_PR:-$PR_NUM}"

          if [ "$mode" = "real" ] && [ "$HAS_KIMI" != "true" ] && [ "$HAS_ANTHROPIC" != "true" ]; then
            echo "    → mode=real requested but no backend secret set; downgrading to stub"
            mode="stub"
          fi
          if [ "$mode" != "fixture" ] && [ -z "$pr" ]; then
            echo "    → no PR number available (manual run without pr-number); downgrading to fixture"
            mode="fixture"
          fi

          # Backend: an explicit dispatch input wins; otherwise prefer
          # claude-code when ANTHROPIC_API_KEY is set (it produced the
          # published 0.857 critical-F1 baseline), else pi-proxy.
          backend="$INPUT_BACKEND"
          if [ -z "$backend" ]; then
            if [ "$HAS_ANTHROPIC" = "true" ]; then
              backend="claude-code"
            else
              backend="pi-proxy"
            fi
          fi

          echo "mode=$mode"       >> "$GITHUB_OUTPUT"
          echo "pr=$pr"           >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "    → resolved: mode=$mode pr=$pr backend=$backend"

      - name: Run council (stub LLM, real PR diff)
        if: steps.cfg.outputs.mode == 'stub' && steps.cfg.outputs.pr != ''
        env:
          AATXE_COUNCIL_STUB: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/council
          ./target/release/aatxe council \
            --pr ${{ steps.cfg.outputs.pr }} \
            --confidence-floor 0.55 \
            --markdown /tmp/council/selftest.md \
            --out /tmp/council/selftest.json

      - name: Run council (stub LLM, fixture diff)
        if: steps.cfg.outputs.mode == 'fixture'
        env:
          AATXE_COUNCIL_STUB: '1'
        run: |
          mkdir -p /tmp/council
          ./target/release/aatxe council \
            --diff-file examples/council-bench/fixtures/sample.diff \
            --confidence-floor 0.55 \
            --markdown /tmp/council/selftest.md \
            --out /tmp/council/selftest.json

      # The claude-code backend shells out to the `claude` binary
      # (`claude --print --output-format json`), authenticated headlessly
      # via ANTHROPIC_API_KEY. Installed only when a real claude-code run
      # is about to happen — stub/fixture paths stay free of it.
      - name: Install claude CLI (claude-code backend)
        if: steps.cfg.outputs.mode == 'real' && steps.cfg.outputs.backend == 'claude-code'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run council (real LLM, real PR diff, post comment)
        if: steps.cfg.outputs.mode == 'real' && steps.cfg.outputs.pr != ''
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          KIMI_MODEL: ${{ secrets.KIMI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/council
          ./target/release/aatxe council \
            --pr ${{ steps.cfg.outputs.pr }} \
            --backend ${{ steps.cfg.outputs.backend }} \
            --confidence-floor 0.55 \
            --markdown /tmp/council/selftest.md \
            --out /tmp/council/selftest.json \
            --post

      - name: Assert sticky marker + JSON shape
        run: |
          set -e
          test -f /tmp/council/selftest.md || { echo "✗ markdown missing"; exit 1; }
          test -f /tmp/council/selftest.json || { echo "✗ json missing"; exit 1; }
          grep -q '<!-- aatxe:council -->' /tmp/council/selftest.md \
            || { echo "✗ sticky marker missing"; exit 1; }
          # Reviews are per-chunk × per-persona. A small PR fits one chunk
          # and yields 4 reviews (one per persona); a large PR chunks and
          # yields 4 × N. The right invariant is "every persona ran at
          # least once", not a fixed count. Without this fix the selftest
          # gates fixture-only PRs and breaks on every real-PR run that
          # chunks (e.g. enekos/aatxe#5).
          uniq_agents=$(jq '[.proposerReviews[].agent] | unique | length' /tmp/council/selftest.json)
          total=$(jq '.proposerReviews | length' /tmp/council/selftest.json)
          if [ "$uniq_agents" != "4" ]; then
            echo "✗ proposer agents covered = $uniq_agents, expected 4 (correctness/security/performance/maintainability)"
            jq '[.proposerReviews[].agent] | unique' /tmp/council/selftest.json
            exit 1
          fi
          if [ "$total" -lt 4 ] || [ "$((total % 4))" -ne 0 ]; then
            echo "✗ proposer review count = $total (must be > 0 and a multiple of 4 — one per persona per chunk)"
            exit 1
          fi
          # `filesReviewed` is data-dependent — small PRs touch 1 file,
          # the fixture touches 4. Just require the field is present and
          # non-negative.
          jq -e '.filesReviewed >= 0' /tmp/council/selftest.json >/dev/null \
            || { echo "✗ filesReviewed missing or invalid"; exit 1; }
          echo "✓ council selftest produced a well-formed sticky body"

      - name: Print rendered body (first 120 lines)
        run: head -120 /tmp/council/selftest.md

      - name: Job summary
        if: always()
        run: |
          echo "## Aatxe Council Selftest" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: ${{ steps.cfg.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: #${{ steps.cfg.outputs.pr }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>Rendered council output</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```markdown' >> "$GITHUB_STEP_SUMMARY"
          head -80 /tmp/council/selftest.md >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload selftest artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: council-selftest
          path: /tmp/council/
          retention-days: 14
