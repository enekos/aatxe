name: release

# Releases are tag-driven. Push an annotated `vX.Y.Z` tag and this
# workflow builds a static-ish `aatxe` binary for each supported target,
# attaches them to a GitHub Release, and publishes the matching
# `scripts/install.sh` one-liner.
#
# Manual `workflow_dispatch` is also wired so the binaries can be cut
# without pushing a tag — handy for testing release plumbing on a fork.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to attach the release to (e.g. v0.1.0). Required when not triggered by a tag push.'
        required: true
        default: 'v0.0.0-dev'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: aatxe-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: aatxe-aarch64-unknown-linux-gnu.tar.gz
            cross: true
          # Both Mac targets cross-compile from a macos-14 (Apple
          # Silicon) runner. The macOS SDK ships both arch headers +
          # libraries, so `cargo build --target x86_64-apple-darwin`
          # from an aarch64 host links a real Intel binary against
          # the same SDK with no extra linker setup. Sidesteps the
          # `macos-13` (Intel) runner queue, which routinely sits at
          # 30+ minutes — and `macos-13` itself is on a deprecation
          # path now that Apple's first-party fleet has gone all-ARM.
          - target: x86_64-apple-darwin
            os: macos-14
            archive: aatxe-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: aatxe-aarch64-apple-darwin.tar.gz

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Cross-compile aarch64 Linux via the official `cross` toolchain —
      # avoids having to provision a multi-arch GHA runner. macOS builds
      # are native (the macos-14 runner cross-compiles to x86_64-darwin
      # against the universal SDK).
      - name: install cross
        if: matrix.cross == true
        run: cargo install cross --locked --version 0.2.5

      # `cross` pulls its toolchain image from `ghcr.io/cross-rs/<target>`,
      # which the unauthenticated `docker` daemon on GH-hosted runners can
      # rate-limit ("docker: Error response from daemon: unauthorized").
      # Authenticating with GITHUB_TOKEN — which the runner already has,
      # scoped to its own repository — sidesteps the limit entirely
      # because GHCR treats authenticated reads of public images
      # differently from anonymous ones.
      - name: ghcr login (cross images)
        if: matrix.cross == true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --bin aatxe --target ${{ matrix.target }}
          else
            cargo build --release --bin aatxe --target ${{ matrix.target }}
          fi

      - name: stage archive
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)/aatxe"
          mkdir -p "$STAGE"
          cp target/${{ matrix.target }}/release/aatxe "$STAGE/aatxe"
          cp LICENSE "$STAGE/LICENSE"
          cp README.md "$STAGE/README.md"
          tar -C "$(dirname "$STAGE")" -czf ${{ matrix.archive }} aatxe
          shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list artifacts
        run: ls -la dist/

      - name: resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: publish github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/aatxe-*.tar.gz
            dist/aatxe-*.tar.gz.sha256

  # SDK publishing rides on the same tag as the binary release. Each
  # sub-job is gated on the relevant secret being set so a tag push
  # without credentials still produces the GH Release + binaries, just
  # without the npm / crates.io artefacts. Each registry's auth token
  # is provisioned manually under repo secrets:
  #   NPM_TOKEN              — automation token from npmjs.com
  #   CARGO_REGISTRY_TOKEN   — publish-scoped token from crates.io
  publish-npm:
    name: publish @aatxe/bench to npm
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check NPM_TOKEN presence
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: echo "go=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: install + build + publish
        if: steps.gate.outputs.go == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: sdk/ts
        run: |
          npm install --no-audit --no-fund
          # `prepublishOnly` already runs the TS build; calling it here
          # too gives a clean failure ahead of `npm publish` so we don't
          # eat the registry-side error message.
          npm run build
          # `--access public` is also in publishConfig, but pass it
          # explicitly so the intent is visible on the publish line.
          npm publish --access public

      - name: skipped (no NPM_TOKEN)
        if: steps.gate.outputs.go != 'true'
        run: echo "    → NPM_TOKEN not set; skipping npm publish for ${{ needs.release.outputs.tag }}"

  publish-crates:
    name: publish aatxe-core + aatxe-bench to crates.io
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check CARGO_REGISTRY_TOKEN presence
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
        run: echo "go=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.go == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.go == 'true'

      # Publish order matters: `aatxe-bench` depends on `aatxe-core`
      # via `version = "0.1"`, so the core crate must be on the
      # registry first. `cargo publish` itself queues for a few seconds
      # before the new version is resolvable; the explicit sleep is
      # cheap insurance against the registry lag racing the second
      # publish.
      - name: publish aatxe-core
        if: steps.gate.outputs.go == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p aatxe-core

      - name: wait for crates.io to surface aatxe-core
        if: steps.gate.outputs.go == 'true'
        run: sleep 30

      - name: publish aatxe-bench
        if: steps.gate.outputs.go == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p aatxe-bench

      - name: skipped (no CARGO_REGISTRY_TOKEN)
        if: steps.gate.outputs.go != 'true'
        run: echo "    → CARGO_REGISTRY_TOKEN not set; skipping crates.io publish for ${{ needs.release.outputs.tag }}"
