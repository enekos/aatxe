name: release

# Releases are tag-driven. Push an annotated `vX.Y.Z` tag and this
# workflow builds a static-ish `aatxe` binary for each supported target,
# attaches them to a GitHub Release, and publishes the matching
# `scripts/install.sh` one-liner.
#
# Manual `workflow_dispatch` is also wired so the binaries can be cut
# without pushing a tag — handy for testing release plumbing on a fork.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to attach the release to (e.g. v0.1.0). Required when not triggered by a tag push.'
        required: true
        default: 'v0.0.0-dev'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: aatxe-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: aatxe-aarch64-unknown-linux-gnu.tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            archive: aatxe-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: aatxe-aarch64-apple-darwin.tar.gz

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Cross-compile aarch64 Linux via the official `cross` toolchain —
      # avoids having to provision a multi-arch GHA runner. macOS builds
      # are native (Apple silicon and Intel runners are both first-party).
      - name: install cross
        if: matrix.cross == true
        run: cargo install cross --locked --version 0.2.5

      - name: build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --bin aatxe --target ${{ matrix.target }}
          else
            cargo build --release --bin aatxe --target ${{ matrix.target }}
          fi

      - name: stage archive
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)/aatxe"
          mkdir -p "$STAGE"
          cp target/${{ matrix.target }}/release/aatxe "$STAGE/aatxe"
          cp LICENSE "$STAGE/LICENSE"
          cp README.md "$STAGE/README.md"
          tar -C "$(dirname "$STAGE")" -czf ${{ matrix.archive }} aatxe
          shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list artifacts
        run: ls -la dist/

      - name: resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: publish github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/aatxe-*.tar.gz
            dist/aatxe-*.tar.gz.sha256
