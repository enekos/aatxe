# Reusable workflow downstream services call to run the aatxe agent
# council against a PR diff.
#
# Usage from a consuming repo:
#
#   jobs:
#     review:
#       uses: enekos/aatxe/.github/workflows/aatxe-council.yml@main
#       with:
#         confidence-floor: '0.55'
#         fail-on-critical: true
#       secrets:
#         KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
#       permissions:
#         pull-requests: write
#         contents: read
#
# What it does:
#   1. Installs the aatxe CLI from this repo.
#   2. Fetches the PR's unified diff over the GitHub API.
#   3. Runs the four-persona Kimi council with a dedicated judge.
#   4. Posts (or updates) the sticky `<!-- aatxe:council -->` comment.
#   5. Optionally fails CI (exit 2) when any shippable finding is
#      severity=critical.

name: aatxe-council

on:
  workflow_call:
    inputs:
      model:
        description: "Kimi model id (default kimi-k2.6)"
        required: false
        default: 'kimi-k2.6'
        type: string
      confidence-floor:
        description: "Hide findings below this judge confidence (0..1)"
        required: false
        default: '0.55'
        type: string
      ignore:
        description: "Newline-separated extra path patterns to skip"
        required: false
        default: ''
        type: string
      fail-on-critical:
        description: "Exit 2 (fail the job) when a critical finding survives"
        required: false
        default: false
        type: boolean
    secrets:
      KIMI_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  council:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HEAD
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/aatxe-src

      - name: Install aatxe CLI
        run: |
          git clone --depth 1 https://github.com/enekos/aatxe "${RUNNER_TEMP}/aatxe-src"
          cargo install --path "${RUNNER_TEMP}/aatxe-src/crates/aatxe" --locked

      - name: Assemble --ignore flags
        id: ignores
        env:
          IGNORES: ${{ inputs.ignore }}
        run: |
          # Take newline-separated patterns and turn each into a `--ignore X` argument.
          flags=""
          while IFS= read -r pat; do
            [ -z "$pat" ] && continue
            flags="$flags --ignore $(printf '%q' "$pat")"
          done <<<"$IGNORES"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"

      - name: Run council
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gate=""
          if [ "${{ inputs.fail-on-critical }}" = "true" ]; then
            gate="--fail-on-critical"
          fi
          aatxe council \
            --pr ${{ github.event.pull_request.number }} \
            --model "${{ inputs.model }}" \
            --confidence-floor "${{ inputs.confidence-floor }}" \
            ${{ steps.ignores.outputs.flags }} \
            --out /tmp/aatxe-council.json \
            --markdown /tmp/aatxe-council.md \
            --post \
            $gate
