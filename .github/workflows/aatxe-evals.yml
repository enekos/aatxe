# aatxe-evals — the eval harness gate.
#
# Synthetic A/B benchmark pairs with known ground truth (null distribution,
# known regression, known improvement, controlled noise, between-run drift),
# scored against the comparator. Pure Rust, deterministic.
#
# Gates on `evals/baseline.json`: if the scenario pass rate drops, the null
# false-positive rate rises, or borderline detection power drops past
# tolerance, the build fails with exit code 2.

name: aatxe-evals

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build aatxe
        run: cargo build --release -p aatxe

      - name: Run evals + baseline gate
        run: |
          mkdir -p tmp
          ./target/release/aatxe evals \
            --out tmp/aatxe-evals.json \
            --markdown tmp/aatxe-evals.md \
            --baseline evals/baseline.json

      - name: Job summary
        if: always()
        run: |
          if [ -f tmp/aatxe-evals.md ]; then
            echo "## Aatxe Evals" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat tmp/aatxe-evals.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aatxe-evals
          path: |
            tmp/aatxe-evals.json
            tmp/aatxe-evals.md
