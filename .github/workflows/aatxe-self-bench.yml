# Self-bench workflow — aatxe gating its own performance with aatxe.
#
# The most meta lane in the repo: it builds aatxe's own microbenchmark
# binaries (`core-bench`, `ast-bench`, `council-bench`), runs them on HEAD,
# runs them again on the PR base, and pipes both through `aatxe compare`
# — the exact comparator a downstream consumer's gate uses. A regression in
# the statistical brain (`aatxe-core`) or the tree-sitter scope extractor
# (`aatxe-ast`) now fails aatxe's own PR queue.
#
# Base-tolerant by design: when a bench binary doesn't exist on the base ref
# yet (e.g. the PR that introduces it), the base run is skipped and the
# comparison degrades to "every bench is New" — informational, never gating.
# Once a bench has landed on master, subsequent PRs get a real HEAD-vs-base
# gate.
#
# Under `act` (no PR base), the workflow self-compares HEAD against itself so
# the full bench → compare → render → marker pipeline is still exercised.

name: aatxe-self-bench

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      threshold:
        description: "Median-delta regression threshold (fraction)"
        required: false
        default: '0.12'
        type: string
      alpha:
        description: "Mann-Whitney U significance level"
        required: false
        default: '0.05'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # Each self-bench example binary + the service tag the comparator pairs on.
  # Keep in sync with examples/*/Cargo.toml and the perf-vs PerfBenchArg enum.
  #
  # Threshold is 0.12, NOT the 0.05 a downstream consumer would use. These
  # benches are tiny, allocation-bound microbenchmarks (prompt assembly, JSON
  # parse, dedup) and HEAD vs base are measured in *separate phases* — a git
  # checkout + cargo rebuild churns caches/thermals between them. That
  # systematic between-phase drift runs ~5-9% on shared GH-hosted runners; at
  # n=200 samples even a 5% offset gives p≈0, so the significance signal can't
  # filter it and the CV noise-gate (<0.25) still passes. Measured empirically:
  # two runs of identical code flap regression/improvement at a 0.05 gate.
  # 0.12 clears that noise floor while still catching a real regression in
  # pure-Rust hot code. (Tracked: a best-of-N / interleaved harness would let
  # this drop back toward 0.05.)
  THRESHOLD: ${{ github.event.inputs.threshold || '0.12' }}
  ALPHA: ${{ github.event.inputs.alpha || '0.05' }}

jobs:
  self-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build aatxe CLI + bench binaries (HEAD)
        run: |
          cargo build --release \
            --bin aatxe \
            --bin aatxe-core-bench \
            --bin aatxe-ast-bench \
            --bin aatxe-council-bench
          # Stash HEAD artefacts so the base checkout can't clobber them.
          mkdir -p /tmp/aatxe-bin
          cp target/release/aatxe              /tmp/aatxe-bin/
          cp target/release/aatxe-core-bench   /tmp/aatxe-bin/
          cp target/release/aatxe-ast-bench    /tmp/aatxe-bin/
          cp target/release/aatxe-council-bench /tmp/aatxe-bin/

      - name: Bench HEAD
        run: |
          mkdir -p /tmp/head
          # Process-level warm-up: the harness only does 5 *intra-process*
          # warmup batches, which don't cover the cold-start of a freshly
          # exec'd, freshly-built binary — code pages and CPU caches are cold,
          # so the FIRST benches in the suite (e.g. diff::parse_unified_diff)
          # read systematically slow. HEAD and base are built + run cold in
          # separate phases, so that cold-start lands asymmetrically and shows
          # up as a phantom regression. A throwaway run warms the binary so the
          # measured run is steady-state on both sides.
          for b in core ast council; do
            "/tmp/aatxe-bin/aatxe-${b}-bench" > /dev/null 2>&1 || true
          done
          AATXE_SERVICE=aatxe-core    AATXE_REF=HEAD /tmp/aatxe-bin/aatxe-core-bench    > /tmp/head/core.json
          AATXE_SERVICE=aatxe-ast     AATXE_REF=HEAD /tmp/aatxe-bin/aatxe-ast-bench     > /tmp/head/ast.json
          AATXE_SERVICE=aatxe-council AATXE_REF=HEAD /tmp/aatxe-bin/aatxe-council-bench > /tmp/head/council.json
          echo "    ✓ HEAD benched (core / ast / council)"

      - name: Bench base (best-effort — base may predate a bench)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set +e
          mkdir -p /tmp/base
          git fetch origin "${{ github.base_ref }}" --depth=1
          git checkout -q "origin/${{ github.base_ref }}"
          # Build + run each bench as it exists on the base ref, one at a
          # time. Per-bench (not a single multi-bin cargo invocation) because
          # `cargo build --bin A --bin B` fails atomically if *any* bin is
          # unknown on base — that would starve a bench that does exist there.
          # Delete the stale HEAD-built binary first so a base build failure
          # can't silently fall back to running HEAD's binary as the "base":
          # absence must mean "new bench → informational", never "no change".
          for svc in core ast council; do
            bin="target/release/aatxe-${svc}-bench"
            rm -f "$bin"
            if cargo build --release --bin "aatxe-${svc}-bench" 2>/dev/null && [ -x "$bin" ]; then
              # Throwaway warm-up run (see "Bench HEAD") so base is measured at
              # steady state too — symmetric with HEAD, kills cold-start drift.
              "$bin" > /dev/null 2>&1 || true
              AATXE_SERVICE="aatxe-${svc}" AATXE_REF="${{ github.base_ref }}" "$bin" > "/tmp/base/${svc}.json" \
                && echo "    ✓ base benched: ${svc}" \
                || echo "    → base bench failed for ${svc} (treated as new)"
            else
              echo "    → no base binary for ${svc} (new bench — informational only)"
            fi
          done
          git checkout -q -

      - name: Compare + gate (per service)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          regressed=0
          : > /tmp/self-bench-report.md
          for svc in core ast council; do
            head="/tmp/head/${svc}.json"
            base="/tmp/base/${svc}.json"
            out="/tmp/${svc}-cmp.json"
            md="/tmp/${svc}-cmp.md"
            if [ -f "$base" ]; then
              echo "### aatxe-${svc} (HEAD vs ${{ github.base_ref }})" >> /tmp/self-bench-report.md
              if /tmp/aatxe-bin/aatxe compare \
                   --base "$base" --head "$head" \
                   --threshold "$THRESHOLD" --alpha "$ALPHA" \
                   --markdown "$md" --out "$out" \
                   --fail-on-regression; then
                echo "    ✓ aatxe-${svc}: no regression"
              else
                code=$?
                if [ "$code" = "2" ]; then
                  echo "    ✗ aatxe-${svc}: REGRESSION (exit 2)"
                  regressed=1
                else
                  echo "    ! aatxe-${svc}: compare errored (exit $code)"; exit "$code"
                fi
              fi
            else
              # No base baseline — self-compare so we still render + prove
              # the pipeline, but never gate on it.
              echo "### aatxe-${svc} (new bench — no base baseline)" >> /tmp/self-bench-report.md
              /tmp/aatxe-bin/aatxe compare \
                --base "$head" --head "$head" \
                --markdown "$md" --out "$out"
              echo "    → aatxe-${svc}: new bench, informational self-compare"
            fi
            cat "$md" >> /tmp/self-bench-report.md
            echo "" >> /tmp/self-bench-report.md
          done
          echo "REGRESSED=$regressed" >> "$GITHUB_ENV"

      - name: Assert pipeline produced a report with the sticky marker
        run: |
          test -s /tmp/self-bench-report.md || { echo "✗ no report produced"; exit 1; }
          grep -q '<!-- aatxe:report -->' /tmp/self-bench-report.md \
            || { echo "✗ sticky marker missing — render path broken"; exit 1; }
          echo "    ✓ self-bench report rendered with sticky marker"

      - name: Upload self-bench artefacts
        # Non-fatal: the artefact is a convenience, not part of the gate, and
        # the upload service shouldn't be able to fail the perf lane. (Also
        # keeps the workflow green under `act`, which has no runtime token.)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aatxe-self-bench
          path: |
            /tmp/head/*.json
            /tmp/*-cmp.json
            /tmp/self-bench-report.md
          if-no-files-found: ignore

      - name: Gate on regressions
        run: |
          if [ "${REGRESSED:-0}" = "1" ]; then
            echo "::error::aatxe self-bench detected a performance regression in its own hot code"
            exit 2
          fi
          echo "    ✓ no self-bench regressions"
