# Self-bench workflow — aatxe gating its own performance with aatxe.
#
# The most meta lane in the repo: it builds aatxe's own microbenchmark
# binaries (`core-bench`, `ast-bench`) for HEAD and for the
# PR base, runs them in interleaved rounds (base,head / head,base / …), and
# pipes every round through `aatxe compare` — the exact comparator a
# downstream consumer's gate uses. A regression in
# the statistical brain (`aatxe-core`) or the tree-sitter scope extractor
# (`aatxe-ast`) now fails aatxe's own PR queue.
#
# Base-tolerant by design: when a bench binary doesn't exist on the base ref
# yet (e.g. the PR that introduces it), the base run is skipped and the
# comparison degrades to "every bench is New" — informational, never gating.
# Once a bench has landed on master, subsequent PRs get a real HEAD-vs-base
# gate.
#
# Under `act` (no PR base), the workflow self-compares HEAD against itself so
# the full bench → compare → render → marker pipeline is still exercised.

name: aatxe-self-bench

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      threshold:
        description: "Median-delta regression threshold (fraction)"
        required: false
        default: '0.05'
        type: string
      alpha:
        description: "Significance level (permutation test across rounds)"
        required: false
        default: '0.05'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # Rounds, not samples, are the unit of replication. Samples inside one
  # process run share its caches, CPU frequency and noisy neighbours, so two
  # back-to-back single runs differ by a systematic 5-9% on shared runners —
  # and at n=200 samples Mann-Whitney calls that p≈0. The old lane had to
  # raise the threshold to 12% to stop flapping.
  #
  # Now each side runs ROUNDS times, interleaved ABBA so drift lands on both
  # sides equally, and `aatxe compare` tests across round medians (exact
  # permutation test, between-round CV for the noise gate). Drift widens the
  # noise instead of faking significance, so the threshold is back to the
  # 5% a downstream consumer uses. 8 vs 8 rounds → min p ≈ 1.6e-4; the
  # benches are sub-second, so the extra rounds cost ~30 s.
  THRESHOLD: ${{ github.event.inputs.threshold || '0.05' }}
  ALPHA: ${{ github.event.inputs.alpha || '0.05' }}
  ROUNDS: '8'
  SERVICES: core ast

jobs:
  self-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build aatxe CLI + bench binaries (HEAD)
        run: |
          cargo build --release \
            --bin aatxe \
            --bin aatxe-core-bench \
            --bin aatxe-ast-bench
          # Stash HEAD artefacts so the base build can't clobber them.
          mkdir -p /tmp/aatxe-bin/head /tmp/aatxe-bin/base
          cp target/release/aatxe /tmp/aatxe-bin/
          for svc in $SERVICES; do
            cp "target/release/aatxe-${svc}-bench" /tmp/aatxe-bin/head/
          done

      - name: Build base bench binaries (best-effort — base may predate a bench)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set +e
          git fetch origin "${{ github.base_ref }}" --depth=1
          git worktree add --detach /tmp/aatxe-base "origin/${{ github.base_ref }}"
          cd /tmp/aatxe-base
          # Per-bench (not one multi-bin cargo invocation) because
          # `cargo build --bin A --bin B` fails atomically if *any* bin is
          # unknown on base — that would starve a bench that does exist
          # there. A missing base binary means "new bench → informational",
          # never "no change". The worktree has its own target/, so a base
          # build failure can't fall back to HEAD's binary.
          for svc in $SERVICES; do
            bin="target/release/aatxe-${svc}-bench"
            if cargo build --release --bin "aatxe-${svc}-bench" 2>/dev/null && [ -x "$bin" ]; then
              cp "$bin" /tmp/aatxe-bin/base/
              echo "    ✓ base built: ${svc}"
            else
              echo "    → no base binary for ${svc} (new bench — informational only)"
            fi
          done

      - name: Bench HEAD and base in interleaved rounds
        run: |
          mkdir -p /tmp/head /tmp/base
          run_side() { # side svc round
            local bin="/tmp/aatxe-bin/$1/aatxe-$2-bench"
            [ -x "$bin" ] || return 0
            AATXE_SERVICE="aatxe-$2" AATXE_REF="$1" "$bin" > "/tmp/$1/$2.r$3.json" \
              || { echo "    ! $1 bench failed for $2 (round $3)"; rm -f "/tmp/$1/$2.r$3.json"; }
          }
          # Warm-up round, discarded: a freshly built, freshly exec'd binary
          # starts with cold code pages and caches.
          for svc in $SERVICES; do
            for side in head base; do
              bin="/tmp/aatxe-bin/${side}/aatxe-${svc}-bench"
              [ -x "$bin" ] && "$bin" > /dev/null 2>&1 || true
            done
          done
          # ABBA: odd rounds base first, even rounds head first, per bench,
          # so neither side systematically runs on a warmer machine.
          for round in $(seq 1 "$ROUNDS"); do
            if [ $((round % 2)) = 1 ]; then order="base head"; else order="head base"; fi
            for svc in $SERVICES; do
              for side in $order; do run_side "$side" "$svc" "$round"; done
            done
          done
          echo "    ✓ benched ${ROUNDS} interleaved rounds"
          ls /tmp/head /tmp/base

      - name: Compare + gate (per service)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          regressed=0
          : > /tmp/self-bench-report.md
          for svc in $SERVICES; do
            heads=(/tmp/head/${svc}.r*.json)
            bases=(/tmp/base/${svc}.r*.json)
            out="/tmp/${svc}-cmp.json"
            md="/tmp/${svc}-cmp.md"
            if [ -e "${bases[0]}" ]; then
              echo "### aatxe-${svc} (HEAD vs ${{ github.base_ref }}, ${#bases[@]}×${#heads[@]} rounds)" >> /tmp/self-bench-report.md
              if /tmp/aatxe-bin/aatxe compare \
                   --base "${bases[@]}" --head "${heads[@]}" \
                   --threshold "$THRESHOLD" --alpha "$ALPHA" \
                   --markdown "$md" --out "$out" \
                   --fail-on-regression; then
                echo "    ✓ aatxe-${svc}: no regression"
              else
                code=$?
                if [ "$code" = "2" ]; then
                  echo "    ✗ aatxe-${svc}: REGRESSION (exit 2)"
                  regressed=1
                else
                  echo "    ! aatxe-${svc}: compare errored (exit $code)"; exit "$code"
                fi
              fi
            else
              # No base baseline (push to master, `act`, or a new bench) —
              # self-compare so we still render + prove the pipeline, but
              # never gate on it.
              echo "### aatxe-${svc} (no base baseline — informational)" >> /tmp/self-bench-report.md
              /tmp/aatxe-bin/aatxe compare \
                --base "${heads[@]}" --head "${heads[@]}" \
                --markdown "$md" --out "$out"
              echo "    → aatxe-${svc}: no base, informational self-compare"
            fi
            cat "$md" >> /tmp/self-bench-report.md
            echo "" >> /tmp/self-bench-report.md
          done
          echo "REGRESSED=$regressed" >> "$GITHUB_ENV"

      - name: Assert pipeline produced a report with the sticky marker
        run: |
          test -s /tmp/self-bench-report.md || { echo "✗ no report produced"; exit 1; }
          grep -q '<!-- aatxe:report -->' /tmp/self-bench-report.md \
            || { echo "✗ sticky marker missing — render path broken"; exit 1; }
          echo "    ✓ self-bench report rendered with sticky marker"

      - name: Upload self-bench artefacts
        # Non-fatal: the artefact is a convenience, not part of the gate, and
        # the upload service shouldn't be able to fail the perf lane. (Also
        # keeps the workflow green under `act`, which has no runtime token.)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aatxe-self-bench
          path: |
            /tmp/head/*.json
            /tmp/base/*.json
            /tmp/*-cmp.json
            /tmp/self-bench-report.md
          if-no-files-found: ignore

      - name: Gate on regressions
        run: |
          if [ "${REGRESSED:-0}" = "1" ]; then
            echo "::error::aatxe self-bench detected a performance regression in its own hot code"
            exit 2
          fi
          echo "    ✓ no self-bench regressions"
