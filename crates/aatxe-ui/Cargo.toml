[package]
name = "aatxe-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local realtime dashboard for aatxe: spawn coding agents in isolated worktrees and watch their benchmark trajectories live"

[dependencies]
aatxe-core = { path = "../aatxe-core" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.7"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "sync",
    "time",
    "io-util",
    "net",
] }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
tempfile = "3.13"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
