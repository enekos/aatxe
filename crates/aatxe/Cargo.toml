[package]
name = "aatxe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Statistical microbenchmark + regression-gate CLI for TypeScript, Go, and Rust"

[[bin]]
name = "aatxe"
path = "src/main.rs"

[features]
# `ui` ships the local realtime dashboard (`aatxe ui`). Default-on so
# `cargo install aatxe` gets it; `--no-default-features` for a slim CLI.
default = ["ui"]
ui = ["dep:aatxe-ui"]

[dependencies]
aatxe-core = { path = "../aatxe-core", version = "0.2.0" }
aatxe-ui = { path = "../aatxe-ui", version = "0.2.0", optional = true }
aatxe-ast = { path = "../aatxe-ast", version = "0.2.0" }
aatxe-evals = { path = "../aatxe-evals", version = "0.2.0" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
ureq = { workspace = true }
regex = { workspace = true }
time = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.13"
