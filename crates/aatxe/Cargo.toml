[package]
name = "aatxe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Statistical microbenchmark + regression-gate CLI for TypeScript, Go, and Rust"

[[bin]]
name = "aatxe"
path = "src/main.rs"

[dependencies]
aatxe-core = { path = "../aatxe-core" }
